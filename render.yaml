services:
  - type: web
    name: villa-paradiso-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villa-paradiso-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"

databases:
  - name: villa-paradiso-db
    plan: free
    databaseName: villa_paradiso
    user: villa
